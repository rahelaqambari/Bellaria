<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body> 
    
    <button class="h-[40px] w-[200px] bg-gray-400 border rounded-md ml-80 mt-4">generate password</button>
    <!-- <button onclick="generatepass()"></button> -->
    <h1 id="password" class="h-[40px] w-[200px] bg-gray-400 border rounded-md ml-80 mt-4 text-center text-2xl" ></h1>
    <h3 class="h-[40px] w-[200px] bg-gray-400 border rounded-md ml-80 mt-4 text-center pt-1.5">Copy to clipbored</h3>


    <script>
        function generatepass(len = 8){
            let text ="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnpoqrstuvwxyz1234567890+-_(><);:&%$#@";
            let password = "";
            for(let i = 0; i < len; i++){
                let indexNumber =Math.floor( Math.random () * text.length);
                password = password+text[indexNumber];

            }
            return password;
        }
         const h1 = document.getElementById("password");
         h1.textContent = generatepass();

    </script>
    
</body>
</html>
